_target_: torch.utils.data.DataLoader
dataset:
  _target_: src.data.components.spider_dataset.SpiderTransformedDataset

  transform:
    _target_: monai.transforms.Compose
    transforms:
    - _target_: monai.transforms.LoadImaged
      keys: [image, label]
      image_only: False
      
    - _target_: src.data.transforms.array.ConvertToMultiChannelBasedOnSpiderSemanticClassesd
      keys: [label]

    - _target_: monai.transforms.EnsureChannelFirstd
      keys: image
      # channel_dim: no_channel
    
    - _target_: monai.transforms.Spacingd
      keys: [image, label]
      pixdim:   ${data.spacing}
      mode: [3, 'nearest']

    # - _target_: monai.transforms.NormalizeIntensityd
    #   keys: image
    #   nonzero: True
    #   channel_wise: True
    
    - _target_: src.data.transforms.array.PercentileNormalizeIntensityd
      keys: image
      percentile: [0.05, 0.95]
      nonzero: True
      channel_wise: True

    - _target_: monai.transforms.ToTensord
      keys: [image, label]

    - _target_: src.data.transforms.array.SemanticBackgroundd
      keys: label
      include_background: ${data.include_background}


  dataset:
    _target_: src.data.components.spider_dataset.SpiderDataset
    data_dir: ${paths.data_dir}dataset/spine_nii
    json_path: ${paths.json_path}spine_cleaned.json
    addon: True

batch_size: 1
num_workers: 4
pin_memory: False
shuffle: False
collate_fn: ## can delete? Nope
  _target_: monai.data.utils.list_data_collate
  _partial_: true
