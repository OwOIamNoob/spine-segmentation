  roi_size:  [32, 256, 256]
  sw_batch_size: 1 ##batch size for sliding window inference
  overlap: 0.6 ##overlap for sliding window inference

device: cuda:0

metric: ${model.metric}

softmax: True
argmax: False
threshold: 0.6