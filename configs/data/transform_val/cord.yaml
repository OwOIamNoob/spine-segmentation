_target_: monai.transforms.Compose
transforms:
  - _target_: monai.transforms.LoadImaged
    keys: [image, label]
    # image_only: False
  
  - _target_: monai.transforms.EnsureChannelFirstd
    keys: [image, label]
  
  - _target_: monai.transforms.Orientationd
    keys: image
    axcodes: RAS

  - _target_: monai.transforms.ResampleToMatchd
    keys: label
    key_dst: image
    mode: nearest
    padding_mode: zeros
    
  
    # channel_dim: no_channel
  

  - _target_: monai.transforms.Spacingd
    keys: [image, label]
    pixdim:  ${data.spacing}
    mode: [3, nearest]
    padding_mode: zeros
    align_corners: True
    ensure_same_shape: False
  
  - _target_: monai.transforms.CropForegroundd
    keys: [image, label]
    source_key: image
    allow_smaller: False

  - _target_: monai.transforms.SpatialPadd
    keys: [image, label]
    spatial_size: ${model.roi} # Ensure channel
    method: end
    mode: constant
    value: 0

  - _target_: src.data.transforms.array.PercentileNormalizeIntensityd
    keys: image
    percentile: [0.05, 0.95]
    nonzero: True
    channel_wise: True
    clip: True
    mean: 0.5
    std: 0.5

  - _target_: monai.transforms.ToTensord
    keys: [image, label]
