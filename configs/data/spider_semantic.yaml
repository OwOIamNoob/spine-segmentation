_target_: src.data.spider_datamodule.SpiderKFoldDataModule

defaults:
  - transform_train: spider_semantic
  - transform_val: spider_semantic

data_dir: ${paths.data_dir}/dataset/spine_nii
json_path: ${paths.json_path}/spine_cases.json
spacing: [1.75, 0.625, 0.5873] # Upsampling and larger window size seems to odd ? 

k: 9 # pick validate fold
split_seed: 200 # keep it constant if you want to reproduce the result
num_splits: 10 
batch_size: 1 # Needs to be divisible by the number of devices (e.g., if in a distributed setup)
num_workers: 8
pin_memory: False

include_background: True 