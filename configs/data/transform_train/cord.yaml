_target_: monai.transforms.Compose

transforms:
  - _target_: monai.transforms.LoadImaged
    keys: [image, label]
    # image_only: False
  
  - _target_: monai.transforms.EnsureChannelFirstd
    keys: [image, label]

  - _target_: monai.transforms.Orientationd
    keys: image
    axcodes: RAS

  - _target_: monai.transforms.ResampleToMatchd
    keys: label
    key_dst: image
    mode: nearest
    padding_mode: zeros
  
  
    
  
    # channel_dim: no_channel
  

  - _target_: monai.transforms.Spacingd
    keys: [image, label]
    pixdim:  ${data.spacing}
    mode: [3, nearest]
    padding_mode: zeros
    align_corners: True
    ensure_same_shape: False
    # Spatial processing and augmentation

  - _target_: monai.transforms.RandCropByPosNegLabeld
    keys: [image, label]
    label_key: label
    spatial_size: ${model.roi}
    pos: 1.
    neg: 1.
    fg_indices_key: [1]
    bg_indices_key: [0]
    num_samples: ${model.sw_batch_size}
    allow_smaller: True
  
  - _target_: monai.transforms.SpatialPadd
    keys: [image, label]
    spatial_size: ${model.roi} # Ensure channel
    method: end
    mode: constant
    value: 0

  - _target_: src.data.transforms.array.Remapd
    keys: image
    quantiles: [0, 1.]
    values: null
    dst_values: [0, 1.]
    nonzero: True

  - _target_: monai.transforms.OneOf
    transforms:  
      - _target_: monai.transforms.RandGaussianNoised
        keys: image
        prob: 0.15
        mean: 0
        std: 0.2
      - _target_: monai.transforms.RandGibbsNoised
        keys: image
        prob: 0.15
        alpha: [0.1, 0.3]
    weights: [0.3, 0.7]

  

  - _target_: monai.transforms.RandBiasFieldd
    keys: image
    prob: 0.15
    degree: 5
    coeff_range: [-0.1, 0.1]

  - _target_: monai.transforms.ThresholdIntensityd
    keys: image
    threshold: 0
    above: true
    cval: 0
  
  - _target_: src.data.transforms.array.Remapd
    keys: image
    quantiles: [0, 1]
    values: null
    dst_values: [0., 1.]
    nonzero: True
  
  - _target_: monai.transforms.Rand3DElasticd
    keys: [image, label]
    prob: 1.
    sigma_range: [3, 5]
    magnitude_range: [3, 10]
    scale_range: 0.1
    rotate_range: 0.1
    shear_range: 0.1
    padding_mode: zeros
    mode: [bilinear, nearest]

  - _target_: src.data.transforms.array.Remapd
    keys: image
    quantiles: [0, 1.]
    values: null
    dst_values: [0., 1.]
    nonzero: True
  # - _target_: src.data.transforms.array.PercentileNormalizeIntensityd
  #   keys: image
  #   percentile: [0.05, 0.95]
  #   nonzero: False
  #   channel_wise: True

  # - _target_: monai.transforms.RandSpatialCropd
  #   keys: [image, label]
  #   roi_size: ${model.roi}
  #   random_center: True 
  #   random_size: False

    
  # - _target_: monai.transforms.Resized
  #   keys: [image, label]
  #   spatial_size: ${model.roi}
  #   size_mode: all
  #   mode: [trilinear, nearest-exact]
  - _target_: monai.transforms.RandFlipd
    keys: [image, label]
    prob: 0.5
    spatial_axis: 0

  - _target_: monai.transforms.RandFlipd
    keys: [image, label]
    prob: 0.5
    spatial_axis: 1
    
  - _target_: monai.transforms.RandFlipd
    keys: [image, label]
    prob: 0.5
    spatial_axis: 2

  - _target_: monai.transforms.ToTensord
    keys: [image, label]
