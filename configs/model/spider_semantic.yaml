_target_: src.models.spider_semantic_module.SpiderLitModule

defaults:
  - optimizer: adam
  - scheduler: warmup_cosine




# compile model for faster training with pytorch 2.0
compile: false

sw_batch_size: 4
roi_x: 32
roi_y: 288 #160
roi_z: 288
infer_overlap: 0.5

# For criterion and metrics configuration 
criterion:
  _target_: monai.losses.DiceLoss
  softmax: True
  weight: [1, 3, 2]

name: ["Vertebrae", "Spinal Canal", "Disk"]