_target_: src.models.spider_semantic_module_test.SpiderLitModule

defaults:
  - optimizer: adam
  - scheduler: warmup_cosine
  - criterion: dicece_weighted
  - net: iso_attn_unet
  - metric: default

# compile model for faster training with pytorch 2.0
compile: false

sw_batch_size: ${data.batch_size}
roi: [32, 256, 256] 
infer_overlap: 0.5

# For criterion and metrics configuration
name: ["None", "Vertebrae", "Canal", "Disk"]
# Background is ignored
argmax: True
softmax: True
threshold: 0.6
ema: null